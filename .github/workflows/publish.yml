# Stages the libraries on npm when main has a version that isn't there yet
# (scripts/publish.mjs): build, test and the install smoke test first, then
# core, then nineos. A maintainer approves each staged version on npm (2FA);
# Tag releases (tag.yml) then tags it with a GitHub Release.
#
# npm Trusted Publishing: no npm token is stored anywhere. Each package on
# npmjs.com trusts this repository and this workflow file for staging only,
# and npm adds provenance (which commit and workflow built it) to every version.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - packages/*/package.json
  workflow_dispatch:

permissions:
  contents: write # tags and GitHub Releases
  id-token: write # npm Trusted Publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags point at the commit that set the version

      # No registry-url: it writes an .npmrc with ${NODE_AUTH_TOKEN}, which Yarn 1
      # refuses to install with when the variable isn't set, and Trusted
      # Publishing needs no token (npm's default registry is npmjs.org)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Node 25+ no longer bundles Yarn
      - name: Install Yarn
        run: npm install -g yarn@1.22.22 --no-fund --no-audit

      # Staged publishing (npm stage) needs npm 11.15.0 or later
      - name: npm for staged publishing
        run: |
          node -e "const [a, b] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && b >= 15) ? 0 : 1)" "$(npm --version)" \
            || npm install -g npm@11 --no-fund --no-audit
          npm --version

      - name: Install
        run: yarn install --frozen-lockfile --non-interactive

      - name: Stands alone (license, imports, naming)
        run: yarn boundary

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Installs and builds from the packed tarballs
        run: yarn smoke

      - name: Stage what isn't on npm yet, tag what's live
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs
