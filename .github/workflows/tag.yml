# Tags each library version that's live on npm but has no tag yet (core@0.2.0,
# nineos@0.2.0) with a GitHub Release. Publish (publish.yml) only stages a
# version; it goes live when a maintainer approves it on npm, which no workflow
# hears about, so this checks every hour. Run it by hand right after approving.
name: Tag releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write # tags and GitHub Releases

concurrency:
  group: publish # never alongside a Publish run
  cancel-in-progress: false

jobs:
  tag:
    name: Tag versions live on npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags point at the commit that set the version

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Tag what's live
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs --tag-only
